[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mypibypy"
version = "0.1.0"
description = "piFISH split-probe (P1L/P1R) design into reusable amplifier systems"
readme = "README.md"
requires-python = ">=3.10"
# biopython: the published nearest-neighbour mismatch tables `thermo` prices
# off-target sites with, used as data rather than retyped.
dependencies = ["openpyxl>=3.1", "biopython>=1.80"]

[project.optional-dependencies]
# Pure-Python test suite. The external tools -- the aligners (blast, bowtie,
# bowtie2) and ViennaRNA (RNAplfold for RNA target-site accessibility, RNAfold
# for probe self-folding) -- are
# not pip-installable; see README for the conda environment. Every one of them
# is optional at runtime: the features that use them report an explicit
# not-screened / not-evaluated status when they are absent.
dev = ["pytest>=8"]
# The MCP server (`python -m mypibypy mcp`). Only that subcommand imports it.
mcp = ["mcp>=2.3"]

[project.scripts]
mypibypy = "mypibypy.cli:main"
mypibypy-mcp = "mypibypy.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# Placeholder systems and example loci ship so a fresh clone runs end to end.
mypibypy = ["systems.example.json", "loci.example.json"]

[tool.pytest.ini_options]
# Makes `pytest` work from this directory with no PYTHONPATH, which is also what
# VS Code's test discovery relies on.
pythonpath = ["src"]
testpaths = ["tests"]
